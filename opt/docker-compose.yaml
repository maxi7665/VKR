services:

    # база данных
    db:
        image: postgres:17-alpine
        container_name: postgres_db
        restart: always
        environment:
            POSTGRES_USER: user        # Имя пользователя
            POSTGRES_PASSWORD: password  # Пароль (обязательно измените)
            POSTGRES_DB: lynceus    # Имя базы данных при создании
        ports:
          - "5432:5432"              # Проброс порта (локальный:контейнерный)
        volumes:
          - postgres_data:/var/lib/postgresql/data

    kafka:
        image: confluentinc/cp-kafka:latest
        container_name: kafka
        ports:
          - "9092:9092"
        networks:
          - kafka-net
        environment:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: 'broker,controller'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
          
          # Слушатели:
          # INTERNAL (29092) — для Kafbat (внутри сети Docker)
          # EXTERNAL (9092)  — для твоих программ на Windows (localhost)
          KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
          
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

    kafbat-ui:
        image: ghcr.io/kafbat/kafka-ui:bbdf7d4
        container_name: kafbat-ui
        ports:
          - "8080:8080"
        networks:
          - kafka-net
        depends_on:
          - kafka
        environment:
          - KAFKA_CLUSTERS_0_NAME=local-cluster
          # ВАЖНО: подключаемся к внутреннему порту Kafka
          - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
          - DYNAMIC_CONFIG_ENABLED=true
          
    valkey:
        image: valkey/valkey:latest
        container_name: valkey-server
        ports:
          - "6379:6379"
        # Включаем уведомления: 
        # K - Keyspace events
        # E - Keyevent events (удобнее для подписки на тип события, например DEL)
        # g - Generic команды (DEL, EXPIRE)
        # x - Expired события (удаление по TTL)
        command: valkey-server --notify-keyspace-events KEA
        restart: always

networks:
  kafka-net:
    driver: bridge

volumes:
    postgres_data: